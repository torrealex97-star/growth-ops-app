version: 2
updates:
  # GitHub ya escanea vulnerabilidades nativamente (Dependabot alerts) sin este archivo; esto
  # añade la parte que faltaba: PRs automáticas para mantener las dependencias al día antes de
  # que se acumulen saltos grandes. Un único ecosistema (npm) y un único bot — no se añade Renovate.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Mensual y con tope bajo: cada PR de Dependabot dispara CI completo y un preview; semanal x 5 era ruido.
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Saltos MAJOR de piezas centrales (framework, auth/DB, runtime) requieren revisión humana
      # explícita de breaking changes, no una PR automática — ver AGENTS.md.
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@supabase/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # ESLint 10 todavía no es compatible con eslint-config-next / typescript-eslint de este repo (su CI
      # falla por peer deps): se revisa a mano cuando el ecosistema lo soporte.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # React Table 9 cambia la API (breaking): migración planificada, no una PR automática.
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']
