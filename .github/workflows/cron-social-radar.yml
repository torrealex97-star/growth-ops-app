# Comprobación diaria del Radar externo. La ruta cuesta cero por defecto: solo lanza Apify para
# subcuentas con opt-in explícito y perfiles configurados, con tope global e idempotencia diaria.
name: 'cron: social-radar'
on:
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-social-radar
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/_/evergreen/cron/social-radar
        env:
          APP_URL: ${{ vars.CRON_APP_URL || 'https://app.scalixsystems.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/_/evergreen/cron/social-radar")
          echo "HTTP $code"
          cat response.json; echo
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
