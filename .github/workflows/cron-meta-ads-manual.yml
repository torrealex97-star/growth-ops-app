# Disparo MANUAL del cron de ANUNCIOS de Meta. Sin schedule: Vercel Cron ya lo lanza a diario
# (02:00 UTC, ver vercel.json — Hobby solo admite 2 crons). Este workflow existe para re-lanzar
# la sync de anuncios a demanda (p. ej. tras corregir el cliente de Meta) con el mismo
# mecanismo y la misma autenticación (Bearer CRON_SECRET) que el resto de crons.
name: 'cron: meta-ads (manual)'
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-meta-ads
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/_/evergreen/cron/meta-ads
        env:
          APP_URL: ${{ vars.CRON_APP_URL || 'https://app.scalixsystems.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/_/evergreen/cron/meta-ads")
          echo "HTTP $code"
          cat response.json; echo
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
