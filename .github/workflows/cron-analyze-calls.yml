# Cron retirado de vercel.json (Vercel Hobby: máx. 2 crons). GitHub Actions lo ejecuta con el
# mismo horario UTC y la misma autenticación (Bearer CRON_SECRET) que usaba Vercel Cron.
name: 'cron: analyze-calls'
on:
  schedule:
    - cron: '0 4 * * *' # diario 04:00 UTC — análisis IA de llamadas con transcripción
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-analyze-calls
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/_/evergreen/cron/analyze-calls
        env:
          APP_URL: ${{ vars.CRON_APP_URL || 'https://app.scalixsystems.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/_/evergreen/cron/analyze-calls")
          echo "HTTP $code"
          # Repo PÚBLICO: los logs de Actions los lee cualquiera. El cuerpo de la respuesta lleva los slugs de todas las
          # subcuentas y mensajes de error internos, así que NO se imprime: solo el tamaño y el indicador `ok`.
          echo "Respuesta omitida ($(wc -c < response.json) bytes) ok=$(jq -r 'try (.ok | tostring) catch "n/d"' response.json 2>/dev/null || echo n/d)"
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
